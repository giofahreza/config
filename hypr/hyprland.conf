# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
source = ~/.config/hypr/monitors.conf


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = nemo
$menu = fuzzel --config $HOME/config/fuzzel/fuzzel.ini


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = mako


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = SHELL,/bin/zsh

# Keep portal-launched GTK dialogs, such as browser file pickers, on the same theme.
exec-once = dbus-update-activation-environment --systemd GTK_THEME XDG_SESSION_TYPE XDG_CURRENT_DESKTOP WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE && $HOME/.local/bin/toshy-services-start
exec-once = $HOME/.local/bin/toshy-tray


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
     disable_splash_rendering = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# Toshy owns modifier and application shortcut translation.
# These compositor bindings receive Toshy's generated Linux shortcuts.
bind = SUPER, D, exec, $menu
bind = ALT, F4, killactive,
bind = ALT, F10, fullscreenstate, 1 0 toggle

# Native window switching is provided by hyprshell (Alt+Tab / Alt+grave).
bind = ALT, Tab, exec, $HOME/.local/bin/hyprshell socat '{"OpenSwitch":{"reverse":false}}'
bind = ALT SHIFT, Tab, exec, $HOME/.local/bin/hyprshell socat '{"OpenSwitch":{"reverse":true}}'
bind = ALT, grave, exec, $HOME/config/scripts/cycle-app-window
bind = ALT SHIFT, grave, exec, $HOME/config/scripts/cycle-app-window --reverse
# Desktop navigation and locking remain compositor actions.
# Include Super in the private backend so Zen can receive Ctrl+Alt+arrows.
bind = SUPER CTRL ALT, Left, workspace, e-1
bind = SUPER CTRL ALT, Right, workspace, e+1
# Custom Control+Shift+arrows: move to an existing workspace and follow.
bind = SUPER CTRL ALT SHIFT, Left, movetoworkspace, e-1
bind = SUPER CTRL ALT SHIFT, Right, movetoworkspace, e+1
# Control+number selects/creates a workspace; Shift moves the window and follows.
bind = SUPER CTRL ALT, 1, workspace, 1
bind = SUPER CTRL ALT, 2, workspace, 2
bind = SUPER CTRL ALT, 3, workspace, 3
bind = SUPER CTRL ALT, 4, workspace, 4
bind = SUPER CTRL ALT, 5, workspace, 5
bind = SUPER CTRL ALT, 6, workspace, 6
bind = SUPER CTRL ALT, 7, workspace, 7
bind = SUPER CTRL ALT, 8, workspace, 8
bind = SUPER CTRL ALT, 9, workspace, 9
bind = SUPER CTRL ALT SHIFT, 1, movetoworkspace, 1
bind = SUPER CTRL ALT SHIFT, 2, movetoworkspace, 2
bind = SUPER CTRL ALT SHIFT, 3, movetoworkspace, 3
bind = SUPER CTRL ALT SHIFT, 4, movetoworkspace, 4
bind = SUPER CTRL ALT SHIFT, 5, movetoworkspace, 5
bind = SUPER CTRL ALT SHIFT, 6, movetoworkspace, 6
bind = SUPER CTRL ALT SHIFT, 7, movetoworkspace, 7
bind = SUPER CTRL ALT SHIFT, 8, movetoworkspace, 8
bind = SUPER CTRL ALT SHIFT, 9, movetoworkspace, 9
# Toshy's Control+Command+Q emits this private backend in terminals and GUI apps.
bind = SUPER CTRL ALT, L, exec, /usr/bin/swaylock -f -c 000000

# Toshy emits held Command as right Ctrl. Hyprland matches either Ctrl side,
# so native Control+drag in terminal windows also invokes these actions.
bindm = CTRL, mouse:272, movewindow
bindm = CTRL, mouse:273, resizewindow

# Screenshot backend and the physical Print key.
bind = , Print, exec, hyprshot -m output -o "$HOME/Documents/Screenshots"
bind = SHIFT, Print, exec, hyprshot -m region -o "$HOME/Documents/Screenshots"
bind = ALT, Print, exec, hyprshot -m window -o "$HOME/Documents/Screenshots"
bind = CTRL, Print, exec, hyprshot -m output --clipboard-only
bind = CTRL SHIFT, Print, exec, hyprshot -m region --clipboard-only
bind = CTRL ALT, Print, exec, hyprshot -m window --clipboard-only

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $HOME/.local/bin/volume-up
bindel = ,XF86AudioLowerVolume, exec, $HOME/.local/bin/volume-down
bindel = ,XF86AudioMute, exec, $HOME/.local/bin/volume-mute-toggle
bindel = ,XF86AudioMicMute, exec, $HOME/.local/bin/mic-mute-toggle
bindel = ,XF86MonBrightnessUp, exec, $HOME/.local/bin/brightness-up
bindel = ,XF86MonBrightnessDown, exec, $HOME/.local/bin/brightness-down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

exec-once = $HOME/.local/bin/start-hyprshell
exec-once = systemctl --user restart hypr-waybar.service
